<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>

        <div class="logo">
            <h1>YouTube</h1>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search">
        </div>

        <div class="profile">
            <img src="images/profile.jpg">
        </div>

    </nav>

    <div class="container">

        <aside class="sidebar">

            <ul>
                <li>Home</li>
                <li>Trending</li>
                <li>Subscriptions</li>
                <li>Library</li>
                <li>History</li>
            </ul>

        </aside>

        <main class="videos">

            <div class="video-card">

                <img src="images/thumbnail1.jpg">

                <h3>Frontend Development Tutorial</h3>

                <p>Tech Channel • 1M views</p>

            </div>

            <div class="video-card">

                <img src="images/thumbnail2.jpg">

                <h3>Learn HTML & CSS</h3>

                <p>Code Studio • 850K views</p>

            </div>

            <div class="video-card">

                <img src="images/thumbnail3.jpg">

                <h3>JavaScript Crash Course</h3>

                <p>Programming Hub • 2M views</p>

            </div>

        </main>

    </div>

</body>
</html>
