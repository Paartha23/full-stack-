<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <nav>
            <h1>Foodie's</h1>

            <ul>
                <li>Home</li>
                <li>Menu</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>

        <div class="hero">

            <h2>Delicious Food For Everyone</h2>

            <p>
                Enjoy the best meals prepared with fresh ingredients
                and served with love.
            </p>

            <button>Explore Menu</button>

        </div>

    </header>

    <section class="menu">

        <h2>Popular Dishes</h2>

        <div class="cards">

            <div class="card">
                <img src="images/food1.jpg">
                <h3>Burger</h3>
                <p>Cheesy grilled burger with fries.</p>
            </div>

            <div class="card">
                <img src="images/food2.jpg">
                <h3>Pizza</h3>
                <p>Freshly baked Italian pizza.</p>
            </div>

            <div class="card">
                <img src="images/food3.jpg">
                <h3>Pasta</h3>
                <p>Creamy pasta with herbs and sauce.</p>
            </div>

        </div>

    </section>

</body>
</html>
