<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <nav>
            <h1>Musicify</h1>

            <ul>
                <li>Home</li>
                <li>Albums</li>
                <li>Playlists</li>
                <li>Contact</li>
            </ul>
        </nav>

        <div class="hero">

            <div class="hero-content">

                <h2>Feel The Music</h2>

                <p>
                    Discover trending songs, playlists,
                    and albums from artists around the world.
                </p>

                <button>Start Listening</button>

            </div>

        </div>

    </header>

    <section class="albums">

        <h2>Trending Albums</h2>

        <div class="album-cards">

            <div class="card">
                <img src="images/album1.jpg">

                <h3>Night Beats</h3>

                <p>Electronic • Pop</p>
            </div>

            <div class="card">
                <img src="images/album2.jpg">

                <h3>Dream Waves</h3>

                <p>LoFi • Chill</p>
            </div>

            <div class="card">
                <img src="images/album3.jpg">

                <h3>Rock Legends</h3>

                <p>Rock • Indie</p>
            </div>

        </div>

    </section>

</body>
</html>
